        body::after {
            content: "";
            position: fixed;
            inset: 12px;
            z-index: -1;
            pointer-events: none;
            border: 1px solid rgba(224, 174, 92, .14);
            box-shadow: inset 0 0 130px rgba(0,0,0,.78), inset 0 0 45px rgba(180,0,22,.12);
        }

        .live-floating-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .live-item {
            position: absolute; bottom: -70px; left: var(--x, 50%);
            width: var(--s, 26px); height: var(--s, 26px); opacity: 0;
            animation: liveRise var(--d, 11s) linear infinite; animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }
        .live-item svg {
            display: block; width: 100%; height: 100%; overflow: visible;
            animation: liveSway var(--sw-d, 3.2s) ease-in-out infinite alternate;
        }
        @keyframes liveRise {
            0%   { transform: translate3d(0, 0, 0); opacity: 0; }
            10%  { opacity: .95; }
            85%  { opacity: .95; }
            100% { transform: translate3d(0, -112vh, 0); opacity: 0; }
        }
        @keyframes liveSway {
            from { transform: translate3d(calc(var(--sw, 18px) * -1), 0, 0) rotate(-12deg); }
            to   { transform: translate3d(var(--sw, 18px), 0, 0) rotate(12deg); }
        }
        @media (prefers-reduced-motion: reduce) { .live-floating-layer { display: none; } }

        .app-container {
            width: 100%; max-width: 980px;
            display: flex; flex-direction: column; align-items: center; gap: 25px;
            position: relative; z-index: 1;
        }

        .title-container {
            text-align: center; position: relative; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 30px 28px 30px; isolation: isolate;
            background:
                radial-gradient(ellipse at 50% -12%, rgba(255,209,120,.28), transparent 56%),
                radial-gradient(ellipse at 0% 100%, rgba(181,30,36,.34), transparent 52%),
                radial-gradient(ellipse at 100% 100%, rgba(181,30,36,.34), transparent 52%),
                linear-gradient(180deg, rgba(32,16,10,.88), rgba(8,5,5,.64));
            border: 1px solid rgba(231,185,105,.58); border-radius: 20px;
            box-shadow: inset 0 0 60px rgba(0,0,0,.6), inset 0 0 0 4px rgba(8,5,5,.55), inset 0 0 0 5px rgba(231,185,105,.24), 0 14px 38px rgba(0,0,0,.4);
        }
        /* 4 góc khung vàng */
        .title-container::before {
            content: ""; position: absolute; inset: 14px; z-index: -1; pointer-events: none;
            background:
                linear-gradient(#f3d18b,#f3d18b) top left / 26px 2px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) top left / 2px 26px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) top right / 26px 2px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) top right / 2px 26px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) bottom left / 26px 2px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) bottom left / 2px 26px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) bottom right / 26px 2px no-repeat,
                linear-gradient(#f3d18b,#f3d18b) bottom right / 2px 26px no-repeat;
            opacity: .85;
        }
        /* vệt sáng vàng chạy dọc mép trên */
        .title-container::after {

        .main-title {

        @keyframes titleShine { 0%, 55% { background-position: 160% 0, 0 0; } 100% { background-position: -60% 0, 0 0; } }
        .main-title.editable:hover { border-color: rgba(255, 215, 140, .5); background: rgba(255, 215, 140, .05); -webkit-text-fill-color: #fff; animation: none; }

        .sub-title-wrapper { display: flex; align-items: center; width: min(100%, 780px); justify-content: center; margin-top: 2px; }

        /* tiêu đề phụ dạng ruy-băng đỏ viền vàng */
        .sub-title {
            position: relative; margin: 0 26px; padding: 9px 32px;

        .sub-title::after  { right: -21px; clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%); }
        .sub-title.editable:hover, .sub-desc.editable:hover { border-color: rgba(255, 215, 140, .5); }

        .sub-desc.editable:focus { border-color: var(--neon-gold); background: rgba(255, 215, 140, .08); }
        .sub-desc {
            font-size: .8rem; color: #e2d0ac; letter-spacing: .8px; margin-top: 4px; max-width: 100%;

        }
        .title-size-controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:8px; padding:10px 12px; border:1px solid rgba(224,174,92,.25); border-radius:12px; background:rgba(8,5,5,.72); width:min(100%,760px); }
        .title-size-item { display:flex; align-items:center; gap:7px; color:#f2d9a6; font-size:11px; }
        .title-size-item input[type=range] { width:105px; accent-color:#e7b95f; }
        .title-size-item output { min-width:34px; color:#fff2ce; font-variant-numeric:tabular-nums; }
        @media(max-width:600px){ .title-container{padding:22px 12px 22px}.main-title{letter-spacing:1.5px;padding:0 4px;font-size:clamp(1.5rem,7.6vw,3rem)!important}.sub-title{letter-spacing:1.5px;padding:8px 14px;margin:0 20px}.sub-desc{padding:6px 12px;font-size:.72rem;border-radius:14px}.title-size-controls{gap:8px}.title-size-item{width:100%;justify-content:space-between}.title-size-item input[type=range]{width:55%} }

        .top-bar {

        .top-btn, .font-select {

        .podium-container {

        }

                linear-gradient(145deg, rgba(255,255,255,.10), transparent 30%),

            background:
                radial-gradient(ellipse at 50% 0%, rgba(255,52,75,.34), transparent 62%),
                linear-gradient(180deg, rgba(58,9,22,.96), rgba(7,3,8,.98) 76%);

        .badge-icon-img {
            position: absolute; top: -56px; width: 100px; height: 100px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,.9));
        }
        .podium-1 .badge-icon-img { filter: drop-shadow(0 8px 14px rgba(0,0,0,.9)) drop-shadow(0 0 16px rgba(255,200,70,.55)); }
        .podium-2 .badge-icon-img { filter: drop-shadow(0 8px 14px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(220,232,248,.38)); }
        .podium-3 .badge-icon-img { filter: drop-shadow(0 8px 14px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(235,150,90,.40)); }
        .podium-avatar {
            width: 94px; height: 94px; border-radius: 50%; object-fit: cover;
            border: 2px solid #e8bd6c; margin-top: 5px; margin-bottom: 13px;
            box-shadow: 0 0 0 5px rgba(232,189,108,.09), 0 0 22px rgba(232,189,108,.25);
        }
        .podium-2 .podium-avatar, .podium-3 .podium-avatar { width: 78px; height: 78px; }
        .podium-2 .podium-avatar { border-color: #cbd0d5; box-shadow: 0 0 0 4px rgba(203,208,213,.08); }
        .podium-3 .podium-avatar { border-color: #c68b5d; box-shadow: 0 0 0 4px rgba(198,139,93,.08); }
        .podium-name {
            font-size: var(--podium-name-size, 18px); font-weight: 800;
            text-transform: uppercase; margin-bottom: 12px; letter-spacing: .8px;
            text-align: center; color: #fff4db; overflow-wrap: anywhere;
            text-shadow: 0 2px 10px rgba(0,0,0,.8);
        }
        .podium-score-box {
            width: 100%; background: rgba(0,0,0,.58); border-radius: 7px;
            padding: 10px 7px; text-align: center; border: 1px solid rgba(226,190,127,.27);
            box-shadow: inset 0 0 16px rgba(0,0,0,.55);

        .podium-score-val {
            font-family: 'Orbitron', sans-serif; font-size: var(--podium-score-size, 20px);
            font-weight: 900; color: #f5d58d; overflow-wrap: anywhere;
            text-shadow: 0 0 14px rgba(239,190,100,.28);
        }
        .podium-2 .podium-score-val { color: #e1e4e8; }
        .podium-3 .podium-score-val { color: #e3ad7c; }


        /* ===== KHUNG TOP 1–3: viền kim loại xoay + glow + vệt sáng quét ===== */
        @property --ring-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
        @keyframes ringSpin { to { --ring-a: 360deg; } }
        @keyframes cardSweep { 0%, 58% { background-position: -120% 0; } 100% { background-position: 220% 0; } }
        @keyframes pulse1 {
            0%, 100% { box-shadow: 0 0 0 1px rgba(255,239,187,.25), 0 0 34px rgba(255,20,50,.22), 0 0 40px rgba(255,200,80,.22), 0 20px 42px rgba(0,0,0,.78); }
            50%      { box-shadow: 0 0 0 1px rgba(255,239,187,.45), 0 0 44px rgba(255,20,50,.30), 0 0 70px rgba(255,205,90,.55), 0 20px 42px rgba(0,0,0,.78); }
        }
        @keyframes pulse2 {
            0%, 100% { box-shadow: 0 0 20px rgba(220,230,245,.14), 0 18px 38px rgba(0,0,0,.78); }
            50%      { box-shadow: 0 0 36px rgba(220,230,245,.34), 0 18px 38px rgba(0,0,0,.78); }
        }
        @keyframes pulse3 {
            0%, 100% { box-shadow: 0 0 20px rgba(230,120,70,.14), 0 18px 38px rgba(0,0,0,.78); }
            50%      { box-shadow: 0 0 36px rgba(235,135,80,.36), 0 18px 38px rgba(0,0,0,.78); }
        }
        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 0 5px rgba(var(--glow),.10), 0 0 18px rgba(var(--glow),.28); }
            50%      { box-shadow: 0 0 0 8px rgba(var(--glow),.20), 0 0 32px rgba(var(--glow),.65); }
        }
        .badge-icon-img { z-index: 3; }
        .podium-card::before {
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 47%, rgba(255,255,255,.20) 50%, rgba(255,255,255,.08) 53%, transparent 65%) -120% 0 / 260% 100% no-repeat;
            animation: cardSweep 6s ease-in-out infinite;
        }
        .podium-card.podium-1 { --glow: 255,207,117; box-shadow: 0 0 0 1px rgba(255,239,187,.3), 0 0 34px rgba(255,20,50,.24), 0 0 46px rgba(255,200,80,.30), 0 20px 42px rgba(0,0,0,.78); }
        .podium-card.podium-2 { --glow: 215,222,235; box-shadow: 0 0 26px rgba(220,230,245,.22), 0 18px 38px rgba(0,0,0,.78); }
        .podium-card.podium-3 { --glow: 230,140,90;  box-shadow: 0 0 26px rgba(235,135,80,.24), 0 18px 38px rgba(0,0,0,.78); }
        .podium-card.podium-2::before { animation-delay: 1.4s; }
        .podium-card.podium-3::before { animation-delay: 2.8s; }
        .podium-card.podium-1::before { animation-delay: .4s; }
        .podium-1 .podium-avatar { border-width: 3px; border-color: #ffd374; }

        /* tên + khung điểm theo màu huy chương */
        .podium-name { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,.75)); }
        .podium-1 .podium-name { background-image: linear-gradient(180deg, #fffbe0 0%, #ffd873 55%, #d9962b 100%); }
        .podium-2 .podium-name { background-image: linear-gradient(180deg, #ffffff 0%, #dfe6ee 55%, #9aa7b6 100%); }
        .podium-3 .podium-name { background-image: linear-gradient(180deg, #fff0dc 0%, #f0b27c 55%, #c2763b 100%); }
        .podium-1 .podium-score-box { border-color: rgba(255,214,120,.62); background: linear-gradient(180deg, rgba(70,34,6,.72), rgba(0,0,0,.66)); box-shadow: inset 0 0 18px rgba(255,190,70,.20), 0 0 18px rgba(255,190,70,.16); }
        .podium-2 .podium-score-box { border-color: rgba(214,222,234,.55); background: linear-gradient(180deg, rgba(48,54,64,.72), rgba(0,0,0,.66)); box-shadow: inset 0 0 16px rgba(220,230,245,.14), 0 0 14px rgba(220,230,245,.10); }
        .podium-3 .podium-score-box { border-color: rgba(226,150,100,.55); background: linear-gradient(180deg, rgba(62,30,14,.72), rgba(0,0,0,.66)); box-shadow: inset 0 0 16px rgba(235,140,80,.16), 0 0 14px rgba(235,140,80,.10); }

        /* viền chạy ánh kim (chỉ bật khi trình duyệt hỗ trợ mask-composite) */
        @supports ((-webkit-mask-composite: xor) or (mask-composite: exclude)) {
            .podium-card.podium-1, .podium-card.podium-2, .podium-card.podium-3 { border-color: transparent; }
            .podium-card::after {
                content: ""; position: absolute; inset: -2px; border-radius: 15px; padding: 2px; z-index: 1; pointer-events: none;
                -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                -webkit-mask-composite: xor; mask-composite: exclude;
                animation: ringSpin 7s linear infinite;
            }
            .podium-card.podium-1::after { padding: 3px; border-radius: 16px; inset: -3px; animation-duration: 5s;
                background: conic-gradient(from var(--ring-a), #fff6c9, #ffcf5a 12%, #9a5b0c 26%, #ffd978 40%, #fffbe6 50%, #e7a929 62%, #7a4508 76%, #ffd978 90%, #fff6c9); }
            .podium-card.podium-2::after {
                background: conic-gradient(from var(--ring-a), #ffffff, #c5ced9 12%, #5e6a77 28%, #e8eef5 45%, #ffffff 50%, #9eabba 65%, #4d5865 80%, #e8eef5 92%, #ffffff); }
            .podium-card.podium-3::after {
                background: conic-gradient(from var(--ring-a), #ffe6c4, #e8a068 12%, #7d3d1c 28%, #f0b27c 45%, #fff0dc 50%, #c9773f 65%, #6a3015 80%, #f0b27c 92%, #ffe6c4); }
        }

        #victoryOverlay.show { display: block; }

        @keyframes voOut { to { opacity: 0; } }

        .vo-vignette { position: absolute; inset: 0; opacity: 0;
            background: radial-gradient(ellipse at 50% 45%, rgba(20,0,4,0) 18%, rgba(14,0,3,.55) 60%, rgba(4,0,1,.92) 100%); }
        #victoryOverlay.build .vo-vignette { animation: voFade .85s ease-out forwards; }
        @keyframes voFade { to { opacity: 1; } }

        .vo-flash { position: absolute; inset: 0; opacity: 0;
            background: radial-gradient(circle at 50% 45%, #fff 0%, #ffe9a8 28%, rgba(255,200,80,0) 70%); }
        #victoryOverlay.hit .vo-flash { animation: voFlash 1.1s ease-out forwards; }
        @keyframes voFlash { 0% { opacity: 0; } 8% { opacity: .95; } 100% { opacity: 0; } }

        .vo-rays { position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; opacity: 0;
            background: repeating-conic-gradient(from 0deg, rgba(255,222,140,.34) 0deg 4deg, rgba(255,222,140,0) 4deg 15deg);
            -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 22%, transparent 52%);
            mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 22%, transparent 52%); }
        #victoryOverlay.hit .vo-rays { animation: voRaysIn 4s ease-out forwards, voSpin 26s linear infinite; }
        @keyframes voRaysIn { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: .55; } }
        @keyframes voSpin { to { transform: rotate(360deg); } }

        .vo-banner { position: absolute; left: 50%; top: 45%; width: min(94vw, 980px); text-align: center; opacity: 0;
            transform: translate(-50%,-50%) scale(.6); }
        #victoryOverlay.hit .vo-banner { animation: voPop 1s cubic-bezier(.16,1.2,.3,1) forwards; }
        @keyframes voPop {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(2.6); filter: blur(14px); }
            40% { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: blur(0); }
        }
        .vo-crown { display: block; width: clamp(54px, 10vw, 96px); height: auto; margin: 0 auto 4px;
            filter: drop-shadow(0 0 18px rgba(255,190,70,.75)) drop-shadow(0 3px 0 rgba(90,40,6,.9)); }
        #victoryOverlay.hit .vo-crown { animation: voCrown .9s .25s cubic-bezier(.2,1.5,.4,1) both; }
        @keyframes voCrown { from { opacity: 0; transform: translateY(-42px) rotate(-10deg) scale(.4); } to { opacity: 1; transform: none; } }

        .vo-kicker { display: flex; align-items: center; justify-content: center; gap: 14px;
            font: 800 clamp(11px, 2.2vw, 20px)/1 'Be Vietnam Pro', sans-serif; letter-spacing: .42em; text-transform: uppercase;
            color: #ffe9b0; text-shadow: 0 0 14px rgba(255,190,70,.7); }
        .vo-kicker i { display: block; height: 1px; width: min(16vw, 150px); background: linear-gradient(90deg, transparent, #ffd873); }
        .vo-kicker i:last-child { transform: scaleX(-1); }

        .vo-top { font-family: 'Playfair Display', serif; font-weight: 900; font-size: clamp(76px, 20vw, 230px); line-height: .95; letter-spacing: .02em; margin: 4px 0 2px;
            background-image: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%),
                              linear-gradient(180deg, #fffbe6 0%, #ffe08a 34%, #f0b43c 58%, #a8661a 100%);
            background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; background-position: 160% 0, 0 0;
            -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 0 rgba(95,45,6,.95)) drop-shadow(0 0 26px rgba(255,170,40,.6)); }
        #victoryOverlay.hit .vo-top { animation: voShine 2.4s ease-in-out .7s 2; }
        @keyframes voShine { from { background-position: 160% 0, 0 0; } to { background-position: -60% 0, 0 0; } }

        .vo-name { font: 800 clamp(22px, 5.4vw, 52px)/1.15 'Be Vietnam Pro', sans-serif; letter-spacing: .14em; color: #fff6dc; margin-top: 6px;
            text-shadow: 0 0 20px rgba(255,185,60,.65), 0 2px 6px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vo-score { display: inline-block; margin-top: 14px; padding: 8px 26px; border-radius: 999px;
            font: 900 clamp(16px, 3.6vw, 30px)/1 'Orbitron', sans-serif; letter-spacing: .08em; color: #ffe39a;
            border: 1px solid rgba(255,214,120,.65); background: linear-gradient(180deg, rgba(90,10,20,.6), rgba(10,2,4,.7));
            box-shadow: 0 0 24px rgba(255,190,70,.35), inset 0 0 16px rgba(255,190,70,.18); }
        #victoryOverlay.hit .vo-name { animation: voUp .7s .55s both; }
        #victoryOverlay.hit .vo-score { animation: voUp .7s .8s both; }
        @keyframes voUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { #victoryOverlay.hit .vo-rays { animation: voRaysIn 4s ease-out forwards; } }

        /* thẻ TOP 1 sáng bừng khi có người vượt lên */
        .podium-card.podium-1.celebrate { animation: podiumHit 2.6s ease-out; }
        @keyframes podiumHit {

        .toast-msg {

            font-weight: 800; padding: 11px 22px; border-radius: 7px;

                const { data, error } = await supabaseClient.from('leaderboard_state')
                    .select('payload, updated_at').eq('id', 1).single();
                if (!error && data?.payload) {
                    lastCloudUpdatedAt = data.updated_at || null;
                    applyCloudState(data.payload);
                } else if (error && error.code !== 'PGRST116') console.error(error);

                // Realtime: nhận thay đổi ngay khi Supabase phát sự kiện.
                supabaseClient.channel('leaderboard-live-sync')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'leaderboard_state', filter: 'id=eq.1' }, change => {
                        const row = change.new;
                        if (row?.payload && row.updated_at !== lastCloudUpdatedAt) {
                            lastCloudUpdatedAt = row.updated_at || null;
                            applyCloudState(row.payload);
                        }
                    }).subscribe(status => {
                        console.log('Leaderboard Realtime:', status);
                    });

                cloudReady = true;

                // Fallback polling: PREVIEW vẫn tự cập nhật nếu Realtime chưa được bật
                // trong publication hoặc kết nối WebSocket của TV không ổn định.
                if (new URLSearchParams(location.search).get('mode') === 'preview') {
                    setInterval(async () => {
                        if (cloudPollBusy || document.hidden) return;
                        cloudPollBusy = true;
                        try {
                            const { data: latest, error: pollError } = await supabaseClient
                                .from('leaderboard_state')
                                .select('payload, updated_at').eq('id', 1).single();
                            if (pollError) throw pollError;
                            if (latest?.payload && latest.updated_at !== lastCloudUpdatedAt) {
                                lastCloudUpdatedAt = latest.updated_at || null;
                                applyCloudState(latest.payload);
                            }
                        } catch (pollErr) {
                            console.warn('Leaderboard cloud polling failed:', pollErr);
                        } finally {
                            cloudPollBusy = false;
                        }
                    }, 2500);
                }

                supabaseClient.auth.onAuthStateChange((_event, session) => {
                    adminAuthenticated = !!session;
                    setAdminMode(adminAuthenticated && new URLSearchParams(location.search).get('mode') !== 'preview');
                });
                setAdminMode(adminAuthenticated && new URLSearchParams(location.search).get('mode') !== 'preview');
            } catch (err) {
                console.error('Cloud initialization failed:', err);
                showToast('KHÔNG THỂ KẾT NỐI CƠ SỞ DỮ LIỆU');
            }
        }

                function applyCloudState(payload) {

        function collectCloudState() {
            return { players, titles: currentTitles, font: currentFont,
                titleSizes: currentTitleSizes, podiumSizes: currentPodiumSizes };
        }

        let cloudSaveInProgress = false;
        let cloudSaveQueued = false;

        async function saveCloudState() {
            if (applyingRemoteState) return;
            localStorage.setItem('diamond_players_v3', JSON.stringify(players));
            localStorage.setItem('diamond_titles_v3', JSON.stringify(currentTitles));
            localStorage.setItem('diamond_font_v3', currentFont);
            localStorage.setItem('diamond_title_sizes_v1', JSON.stringify(currentTitleSizes));
            localStorage.setItem('diamond_podium_text_sizes_v1', JSON.stringify(currentPodiumSizes));
            if (!supabaseClient || !cloudReady || !adminAuthenticated) {
                if (new URLSearchParams(location.search).get('mode') !== 'preview')
                    showToast('CHƯA ĐỒNG BỘ: HÃY ĐĂNG NHẬP ADMIN');
                return;
            }
            // Avoid overlapping writes; if edits occur during a save, write the latest state afterward.
            if (cloudSaveInProgress) { cloudSaveQueued = true; return; }
            cloudSaveInProgress = true;
            try {
                do {
                    cloudSaveQueued = false;
                    const { error } = await supabaseClient.from('leaderboard_state').upsert({
                        id: 1, payload: collectCloudState(), updated_at: new Date().toISOString()
                    }, { onConflict: 'id' });
                    if (error) {
                        console.error('Supabase save failed:', error);
                        showToast('LƯU ONLINE THẤT BẠI: ' + error.message);
                        break;
                    }
                } while (cloudSaveQueued);
                if (!cloudSaveQueued) showToast('ĐÃ LƯU & ĐỒNG BỘ ONLINE');
            } catch (err) {
                console.error('Cloud save exception:', err);
                showToast('LỖI KẾT NỐI KHI ĐỒNG BỘ');
            } finally {
                cloudSaveInProgress = false;
            }
        }

            adminAuthenticated = !!signInData.session;
            setAdminMode(adminAuthenticated && new URLSearchParams(location.search).get('mode') !== 'preview');

            const { data, error: loadError } = await supabaseClient.from('leaderboard_state')

                await saveCloudState();

        }

        // --- ÂM THANH & HIỆU ỨNG CHÚC MỪNG TOP 1 (bản nâng cấp) ---
        let sfxBus = null;
        let noiseBuf = null;
        let fxState = null;
        const IMPACT_MS = 850; // thời điểm "nổ" của hiệu ứng, khớp với đoạn riser âm thanh

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!sfxBus) buildSfxBus();
        }

        // Chuỗi xử lý: nguồn -> (dry + reverb) -> master -> compressor -> loa
        function buildSfxBus() {
            const sr = audioCtx.sampleRate;

            const irLen = Math.floor(sr * 2.8);
            const ir = audioCtx.createBuffer(2, irLen, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = ir.getChannelData(ch);
                for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.6);
            }

            noiseBuf = audioCtx.createBuffer(1, sr * 2, sr);
            const nd = noiseBuf.getChannelData(0);
            for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

            const master = audioCtx.createGain(); master.gain.value = 0.85;
            const comp = audioCtx.createDynamicsCompressor();
            comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 4;
            comp.attack.value = 0.004; comp.release.value = 0.25;

            const dry = audioCtx.createGain();
            const reverb = audioCtx.createConvolver(); reverb.buffer = ir;
            const wetOut = audioCtx.createGain(); wetOut.gain.value = 0.55;

            dry.connect(master);
            reverb.connect(wetOut); wetOut.connect(master);
            master.connect(comp); comp.connect(audioCtx.destination);
            sfxBus = { dry, reverb };
        }

        function route(node, wet) {
            node.connect(sfxBus.dry);
            if (wet > 0) {
                const s = audioCtx.createGain(); s.gain.value = wet;
                node.connect(s); s.connect(sfxBus.reverb);
            }
        }

        function noiseSrc(t, dur) {
            const n = audioCtx.createBufferSource();
            n.buffer = noiseBuf; n.loop = true;
            n.start(t, Math.random() * 1.5); n.stop(t + dur);
            return n;
        }

        // Chuông thủy tinh (FM) – trong, sang, có đuôi vang
        function bell(freq, t, vel, dur, wet) {
            const c = audioCtx.createOscillator(), m = audioCtx.createOscillator();
            const mg = audioCtx.createGain(), g = audioCtx.createGain();
            c.type = 'sine'; m.type = 'sine';
            c.frequency.value = freq; m.frequency.value = freq * 3.5;
            mg.gain.setValueAtTime(freq * 1.1 * vel, t);
            mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + dur * 0.55);
            m.connect(mg); mg.connect(c.frequency);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.26 * vel, t + 0.004);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            c.connect(g);

            const p = audioCtx.createOscillator(), pg = audioCtx.createGain();
            p.type = 'sine'; p.frequency.value = freq * 2.0;
            pg.gain.setValueAtTime(0.0001, t);
            pg.gain.exponentialRampToValueAtTime(0.07 * vel, t + 0.004);
            pg.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.5);
            p.connect(pg); pg.connect(g);

            route(g, wet);
            c.start(t); m.start(t); p.start(t);
            c.stop(t + dur + 0.05); m.stop(t + dur + 0.05); p.stop(t + dur * 0.5 + 0.05);
        }

        // Kèn đồng (2 sawtooth lệch pha + lowpass "mở" theo envelope)
        function brass(freq, t, dur, vel, attack, bright) {
            attack = Math.min(attack || 0.05, dur * 0.4);
            bright = bright || 1;
            const f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
            f.type = 'lowpass'; f.Q.value = 1.1;
            f.frequency.setValueAtTime(freq * 1.4, t);
            f.frequency.exponentialRampToValueAtTime(Math.min(freq * 7 * bright, 9000), t + attack + 0.07);
            f.frequency.exponentialRampToValueAtTime(freq * 2.6, t + dur);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(0.04 * vel, t + attack);
            g.gain.setValueAtTime(0.04 * vel, t + dur * 0.6);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
            [-7, 7].forEach(cents => {
                const o = audioCtx.createOscillator();
                o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = cents;
                o.connect(f); o.start(t); o.stop(t + dur + 0.4);
            });
            f.connect(g); route(g, 0.22);
        }

        // Cú nổ trầm: sub-bass rơi + tiếng "thịch"
        function boom(t, v) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(130, t);
            o.frequency.exponentialRampToValueAtTime(38, t + 0.55);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.85 * v, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
            o.connect(g); route(g, 0.1); o.start(t); o.stop(t + 1.55);

            const n = noiseSrc(t, 0.5), lf = audioCtx.createBiquadFilter(), ng = audioCtx.createGain();
            lf.type = 'lowpass'; lf.frequency.value = 520;
            ng.gain.setValueAtTime(0.0001, t);
            ng.gain.exponentialRampToValueAtTime(0.5 * v, t + 0.006);
            ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
            n.connect(lf); lf.connect(ng); route(ng, 0.15);
        }

        // Cymbal crash / shimmer
        function crash(t, v) {
            const n = noiseSrc(t, 2.6), hf = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
            hf.type = 'highpass'; hf.frequency.value = 5500;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.24 * v, t + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
            n.connect(hf); hf.connect(g); route(g, 0.5);
        }

        // Âm báo cập nhật: hai tiếng "ting" thủy tinh + chút thân trầm
        function sfxUpdate(t) {
            bell(1318.51, t, 0.55, 0.9, 0.35);
            bell(1975.53, t + 0.075, 0.4, 0.8, 0.35);
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(220, t);
            o.frequency.exponentialRampToValueAtTime(110, t + 0.09);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.14, t + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            o.connect(g); route(g, 0); o.start(t); o.stop(t + 0.16);
        }

        // Âm thanh TOP 1: riser căng thẳng -> cú nổ -> kèn fanfare I–IV–V–I -> chuông lấp lánh
        function sfxTop1(t0) {
            const T = t0 + IMPACT_MS / 1000;

            // 1) Riser
            const rn = noiseSrc(t0, 0.95), rf = audioCtx.createBiquadFilter(), rg = audioCtx.createGain();
            rf.type = 'bandpass'; rf.Q.value = 3;
            rf.frequency.setValueAtTime(250, t0);
            rf.frequency.exponentialRampToValueAtTime(8000, T);
            rg.gain.setValueAtTime(0.0001, t0);
            rg.gain.exponentialRampToValueAtTime(0.3, T);
            rg.gain.linearRampToValueAtTime(0.0001, T + 0.04);
            rn.connect(rf); rf.connect(rg); route(rg, 0.25);

            const so = audioCtx.createOscillator(), sg = audioCtx.createGain();
            so.type = 'triangle';
            so.frequency.setValueAtTime(196, t0);
            so.frequency.exponentialRampToValueAtTime(1568, T);
            sg.gain.setValueAtTime(0.0001, t0);
            sg.gain.exponentialRampToValueAtTime(0.12, T);
            sg.gain.linearRampToValueAtTime(0.0001, T + 0.04);
            so.connect(sg); route(sg, 0.3); so.start(t0); so.stop(T + 0.05);

            // 2) Hai nốt dạo đầu
            brass(392.00, t0 + 0.52, 0.13, 0.6, 0.02);
            brass(523.25, t0 + 0.68, 0.13, 0.6, 0.02);

            // 3) Cú nổ + hợp âm C trưởng
            boom(T, 1);
            crash(T, 1);
            const hits = [
                { t: T,        dur: 0.50, notes: [130.81, 196.00, 261.63, 329.63, 392.00], lead: 783.99 },
                { t: T + 0.55, dur: 0.28, notes: [174.61, 261.63, 349.23, 440.00],         lead: 880.00 },
                { t: T + 0.90, dur: 0.28, notes: [196.00, 293.66, 392.00, 493.88],         lead: 987.77 }
            ];
            hits.forEach(h => {
                h.notes.forEach(f => brass(f, h.t, h.dur, 0.8, 0.03));
                brass(h.lead, h.t, h.dur, 1.0, 0.03, 1.3);
            });

            // 4) Hợp âm kết "đại thắng"
            const F = T + 1.25;
            [130.81, 196.00, 261.63, 329.63, 392.00, 523.25].forEach(f => brass(f, F, 1.9, 0.85, 0.06));
            brass(1046.50, F, 1.9, 1.0, 0.04, 1.4);
            boom(F, 0.8);
            crash(F, 1.2);

            // 5) Chuông lấp lánh rải xuống
            const sc = [1046.50, 1318.51, 1567.98, 1760.00, 2093.00, 2637.02, 3135.96, 3520.00];
            for (let i = 0; i < 14; i++) bell(sc[i % sc.length], F + 0.05 + i * 0.085, Math.max(0.22, 0.55 - i * 0.02), 1.4, 0.6);
            for (let i = 0; i < 12; i++) bell(sc[Math.floor(Math.random() * sc.length)], F + 1.3 + Math.random() * 1.7, 0.15 + Math.random() * 0.15, 1.2, 0.65);
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            const btn = document.getElementById('audioToggleBtn');
            btn.innerHTML = isMuted ? '🔇 SFX: TẮT' : '🔊 SFX: BẬT';

        // Id của người đang TOP 1 (theo điểm cao nhất)
        function getTopId(list) {
            if (!list || !list.length) return null;
            return [...list].sort((a, b) => b.score - a.score)[0].id;
        }
        // TOP 1 hiện tại có khác TOP 1 trước đó không?
        function isNewTop1(oldTopId) {
            const newTopId = getTopId(players);
            return !!newTopId && newTopId !== oldTopId;

        // --- HIỆU ỨNG TOP 1: tối viền -> flash -> tia sáng -> banner vàng -> pháo hoa & confetti ---
        function triggerCelebration() {
            const overlay = document.getElementById('victoryOverlay');
            const canvas = document.getElementById('confettiCanvas');
            if (!overlay || !canvas) return;
            if (fxState) fxState.cancel();

            const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            const Q = reduce ? 0.35 : 1;
            const top = players[0];
            document.getElementById('voName').textContent = top ? top.name : '';
            document.getElementById('voScore').textContent = top ? top.score.toLocaleString() + ' 💎' : '';

            overlay.className = '';

            overlay.classList.add('show', 'build');
            const timers = [];
            const later = (fn, ms) => timers.push(setTimeout(fn, ms));
            const podium = () => document.querySelector('.podium-card.podium-1');
            later(() => overlay.classList.add('hit'), IMPACT_MS);
            later(() => { const c = podium(); if (c) { c.classList.remove('celebrate'); void c.offsetWidth; c.classList.add('celebrate'); } }, IMPACT_MS);
            later(() => { const c = podium(); if (c) c.classList.remove('celebrate'); }, IMPACT_MS + 2700);
            later(() => overlay.classList.add('out'), 4700);
            later(() => { overlay.className = ''; }, 5700);

            // Canvas (sắc nét trên màn hình retina)
            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = window.innerWidth, H = window.innerHeight;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            canvas.style.display = 'block';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const rand = (a, b) => a + Math.random() * (b - a);
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            const GOLD = ['#fff3c4', '#ffd873', '#f7c04a', '#e8a838', '#fff9e6'];
            const RED = ['#ff2d4d', '#d4142e', '#ff7a8c'];
            const CONF = ['#ffd873', '#f7c04a', '#fff3c4', '#e8a838', '#d4142e', '#ff2d4d', '#ffffff'];
            const ps = [];

            const spark = (x, y, vx, vy, o) => ps.push({ k: 's', x, y, vx, vy, age: 0, max: o.max || 60, size: o.size || 2, color: o.color || pick(GOLD), g: o.g === undefined ? 0.05 : o.g, drag: o.drag || 0.985, tw: !!o.tw });
            const confetti = (x, y, vx, vy) => ps.push({ k: 'c', x, y, vx, vy, w: rand(6, 11), h: rand(11, 19), rot: rand(0, 6.28), vr: rand(-0.25, 0.25), fl: rand(0, 6.28), vf: rand(0.12, 0.3), color: pick(CONF), age: 0, max: rand(170, 260) });
            const glitter = (x, y, vx, vy, size) => ps.push({ k: 'g', x, y, vx, vy, size, ph: rand(0, 6.28), sp: rand(0.1, 0.22), age: 0, max: rand(70, 130), color: pick(['#ffffff', '#fff3c4', '#ffd873']) });
            const ring = (x, y, maxR, delay, max) => ps.push({ k: 'r', x, y, maxR, age: -(delay || 0), max: max || 55 });

            function star(x, y, s) {
                ctx.beginPath();
                ctx.moveTo(x, y - s);
                ctx.quadraticCurveTo(x + s * 0.12, y - s * 0.12, x + s, y);
                ctx.quadraticCurveTo(x + s * 0.12, y + s * 0.12, x, y + s);
                ctx.quadraticCurveTo(x - s * 0.12, y + s * 0.12, x - s, y);
                ctx.quadraticCurveTo(x - s * 0.12, y - s * 0.12, x, y - s);
                ctx.fill();
            }

            function explode(x, y) {
                const style = pick(['peony', 'ring', 'willow', 'peony']);
                const pal = pick([GOLD, GOLD, RED]);
                const n = Math.round((style === 'ring' ? 64 : 90) * Q);
                for (let i = 0; i < n; i++) {
                    const a = style === 'ring' ? (i / n) * Math.PI * 2 : rand(0, Math.PI * 2);
                    const sp = style === 'ring' ? 5.4 : rand(1.6, 6.8);
                    spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, {
                        max: style === 'willow' ? rand(90, 140) : rand(48, 78),
                        size: rand(1.4, 2.6), color: pick(pal),
                        g: style === 'willow' ? 0.035 : 0.05,
                        drag: style === 'willow' ? 0.975 : 0.983, tw: Math.random() < 0.35
                    });
                }
                ring(x, y, 70, 0, 22);
                for (let i = 0; i < Math.round(8 * Q); i++) glitter(x, y, rand(-1.5, 1.5), rand(-1.5, 1.5), rand(6, 12));
            }

            function rocket() {
                const x0 = rand(W * 0.15, W * 0.85);
                const tx = Math.max(W * 0.08, Math.min(W * 0.92, x0 + rand(-W * 0.12, W * 0.12)));
                const ty = rand(H * 0.14, H * 0.42);
                const g = 0.12, v = Math.sqrt(2 * g * (H - ty + 10));
                ps.push({ k: 'k', x: x0, y: H + 10, vx: (tx - x0) / (v / g), vy: -v, g });
            }

            function cannons(n) {
                n = Math.round(n * Q);
                for (let i = 0; i < n; i++) {
                    const a = rand(60, 82) * Math.PI / 180;
                    const sp = H * rand(0.014, 0.026);
                    confetti(-10, H + 10, Math.cos(a) * sp, -Math.sin(a) * sp);
                    confetti(W + 10, H + 10, -Math.cos(a) * sp, -Math.sin(a) * sp);
                }
            }

            function impact() {
                const cx = W / 2, cy = H * 0.45;
                ring(cx, cy, Math.max(W, H) * 0.75, 0, 55);
                ring(cx, cy, Math.max(W, H) * 0.5, 6, 55);
                const n = Math.round(150 * Q);
                for (let i = 0; i < n; i++) {
                    const a = rand(0, Math.PI * 2), sp = rand(2, 15);
                    spark(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp, { max: rand(40, 80), size: rand(1.5, 3), g: 0.06, drag: 0.972, tw: true });
                }
                cannons(75);
                for (let i = 0; i < Math.round(30 * Q); i++) glitter(cx + rand(-W * 0.25, W * 0.25), cy + rand(-H * 0.2, H * 0.2), rand(-0.6, 0.6), rand(-0.4, 0.5), rand(8, 18));
            }

            function finale() {
                const cx = W / 2, cy = H * 0.45;
                ring(cx, cy, Math.max(W, H) * 0.6, 0, 60);
                cannons(55);
                for (let i = 0; i < Math.round(90 * Q); i++) {
                    const a = rand(0, Math.PI * 2), sp = rand(2, 11);
                    spark(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp, { max: rand(50, 90), size: rand(1.5, 2.8), g: 0.05, drag: 0.975, tw: true });
                }
                for (let i = 0; i < Math.round(26 * Q); i++) glitter(rand(0, W), rand(0, H * 0.7), rand(-0.4, 0.4), rand(0, 0.6), rand(8, 16));
            }

            const sched = [{ t: IMPACT_MS, fn: impact }, { t: 2100, fn: finale }];
            if (!reduce) [1300, 1650, 1650, 2000, 2350, 2700, 2700, 3100, 3500].forEach(t => sched.push({ t, fn: rocket }));
            sched.sort((a, b) => a.t - b.t);

            function render(p, dt) {
                switch (p.k) {
                    case 's': {
                        p.age += dt; if (p.age >= p.max) return false;
                        const dr = Math.pow(p.drag, dt);
                        p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
                        p.x += p.vx * dt; p.y += p.vy * dt;
                        let a = 1 - p.age / p.max; a *= a;
                        if (p.tw) a *= 0.55 + 0.45 * Math.sin(p.age * 0.9);
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.globalAlpha = Math.max(0, a);
                        ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); ctx.lineTo(p.x, p.y); ctx.stroke();
                        return true;
                    }
                    case 'c': {
                        p.age += dt; if (p.age >= p.max || p.y > H + 40) return false;
                        const dr = Math.pow(0.985, dt);
                        p.vx *= dr; p.vy = Math.min(p.vy * dr + 0.11 * dt, 3.2);
                        p.x += (p.vx + Math.sin(p.fl) * 0.6) * dt; p.y += p.vy * dt;
                        p.rot += p.vr * dt; p.fl += p.vf * dt;
                        const cs = Math.cos(p.fl);
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.globalAlpha = Math.min(1, (p.max - p.age) / 40) * (cs > 0 ? 1 : 0.72);
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, cs);
                        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                        return true;
                    }
                    case 'g': {
                        p.age += dt; if (p.age >= p.max) return false;
                        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.004 * dt;
                        const tw = Math.abs(Math.sin(p.age * p.sp + p.ph));
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.globalAlpha = Math.min(1, (p.max - p.age) / 25) * tw;
                        ctx.fillStyle = p.color; star(p.x, p.y, p.size * (0.3 + 0.7 * tw));
                        return true;
                    }
                    case 'r': {
                        p.age += dt; if (p.age < 0) return true; if (p.age >= p.max) return false;
                        const t = p.age / p.max, e = 1 - Math.pow(1 - t, 3);
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.globalAlpha = (1 - t) * 0.9;
                        ctx.strokeStyle = '#ffd873'; ctx.lineWidth = 2 + 14 * (1 - t);
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.maxR * e, 0, Math.PI * 2); ctx.stroke();
                        return true;
                    }
                    case 'k': {
                        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
                        spark(p.x, p.y, rand(-0.3, 0.3), rand(0.2, 1), { max: 22, size: 1.4, color: '#ffd873', g: 0.02 });
                        if (p.vy >= -0.6) { explode(p.x, p.y); return false; }
                        return true;
                    }
                }
                return false;
            }

            let raf = 0, last = performance.now(), start = last;
            function finish() {
                cancelAnimationFrame(raf);
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                canvas.style.display = 'none';
                if (fxState && fxState.id === id) fxState = null;
            }
            const id = Math.random();
            fxState = {
                id,
                cancel() {
                    timers.forEach(clearTimeout);
                    const c = podium(); if (c) c.classList.remove('celebrate');
                    overlay.className = '';
                    finish();
                }
            };

            function frame(now) {
                const dt = Math.min(2.5, (now - last) / 16.667); last = now;
                const el = now - start;
                while (sched.length && sched[0].t <= el) sched.shift().fn();

                if (el < IMPACT_MS) {
                    let k = Math.random() * 3 * dt * Q;
                    while (k-- > 0) spark(rand(W * 0.2, W * 0.8), H + 5, rand(-0.5, 0.5), -rand(3, 8), { max: rand(40, 70), size: 1.6, g: -0.02, drag: 0.99, tw: true });
                } else if (el < 4300 && Math.random() < 0.85 * dt * Q) {

            }

        }

            if (remaining.length > 0) {
                tableCardEl.style.display = 'block';
                remaining.forEach((p, idx) => {
                    const rank = idx + 4;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="table-rank">#${rank}</td>
                        <td>
                            <img src="${p.avatar}" class="table-row-avatar" alt="${p.name}">
                            <span class="table-row-name">${p.name}</span>
                        </td>
                        <td class="table-score" style="text-align: right; padding-right: 25px;">${p.score.toLocaleString()} 💎</td>
                    `;
                    tbodyEl.appendChild(tr);
                });
            } else {
                tableCardEl.style.display = 'none';
            }

            renderAdminControls();
        }

        function renderAdminControls() {
            const adminEl = document.getElementById('adminControls');
            adminEl.innerHTML = '';
            players.forEach(p => {
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <div class="admin-user-info">
                        <input type="text" class="input-field name-input" id="name_${p.id}" value="${p.name}">
                        <input type="text" class="input-field avatar-input" id="avatar_${p.id}" value="${p.avatar}" placeholder="Link Avatar...">
                        <input type="number" class="score-input" id="score_${p.id}" value="${p.score}">
                    </div>
                    <div class="btn-group" style="display:flex; gap:8px; align-items:center;">
                        <button class="btn-update" onclick="saveDirectScore('${p.id}')">Lưu</button>
                        <button class="btn-del" onclick="deletePlayer('${p.id}')">✕</button>
                    </div>
                `;
                adminEl.appendChild(row);
            });
        }

        function saveDirectScore(id) {
            if (!adminAuthenticated) return alert('Vui lòng đăng nhập ADMIN.');
            initAudio();
            const player = players.find(p => p.id === id);
            if (!player) return;

            const oldTopId = getTopId(players);
            player.name = document.getElementById(`name_${id}`).value.trim().toUpperCase();
            player.avatar = document.getElementById(`avatar_${id}`).value.trim();
            player.score = parseInt(document.getElementById(`score_${id}`).value) || 0;

            saveToStorage();
            renderLeaderboard();

            if (isNewTop1(oldTopId)) {
                playSFX('top1');
            } else {
                playSFX('update');
            }
        }

        function handleAddPlayer(e) {
            e.preventDefault();
            if (!adminAuthenticated) return alert('Vui lòng đăng nhập ADMIN.');
            initAudio();
            const name = document.getElementById('newName').value.trim().toUpperCase();
            const avatar = document.getElementById('newAvatar').value.trim();
            const score = parseInt(document.getElementById('newScore').value) || 0;

            if (name) {
                const oldTopId = getTopId(players);
                const newId = 'p_' + Date.now();
                players.push({ id: newId, name, avatar, score });
                document.getElementById('newName').value = '';
                document.getElementById('newAvatar').value = '';
                document.getElementById('newScore').value = '100000';
                saveToStorage();
                renderLeaderboard();
                playSFX(isNewTop1(oldTopId) ? 'top1' : 'update');
            }
        }

        function deletePlayer(id) {
            if (!adminAuthenticated) return alert('Vui lòng đăng nhập ADMIN.');
            initAudio();
            const oldTopId = getTopId(players);
            players = players.filter(p => p.id !== id);
            saveToStorage();
            renderLeaderboard();
            playSFX(isNewTop1(oldTopId) ? 'top1' : 'update');
        }
    </script>
